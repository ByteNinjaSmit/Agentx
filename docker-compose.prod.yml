services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: compintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: compintel
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    # no host port published — n8n reaches it over the compose network only

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - N8N_EDITOR_BASE_URL=https://${N8N_DOMAIN}/
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on: [postgres]

  backend:
    image: byteninjasmit/agentx-backend:latest
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AGENT_PROVIDER=${AGENT_PROVIDER:-gemini}
      - DATABASE_URL=postgresql://compintel:${POSTGRES_PASSWORD}@postgres:5432/compintel
      - S2_API_KEY=${S2_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GOOGLE_SEARCH_API_KEY=${GOOGLE_SEARCH_API_KEY}
      - GOOGLE_SEARCH_CX=${GOOGLE_SEARCH_CX}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on: [postgres]

  frontend:
    image: byteninjasmit/agentx-frontend:latest
    restart: unless-stopped
    # NEXT_PUBLIC_N8N_WEBHOOK_URL / NEXT_PUBLIC_API_URL are baked in at build
    # time (CI), not here — see .github/workflows/deploy.yml build-args
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [n8n, backend]

volumes:
  pgdata:
  n8n_data:
