name: Deploy

on:
  push:
    branches: [main]

env:
  FRONTEND_IMAGE: byteninjasmit/agentx-frontend
  BACKEND_IMAGE: byteninjasmit/agentx-backend

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_N8N_WEBHOOK_URL=https://agentx.n8n.twistark.cloud/webhook/compintel-run
            NEXT_PUBLIC_API_URL=https://api.agentx.twistark.cloud
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  build-and-push-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  deploy:
    needs: [build-and-push-frontend, build-and-push-backend]
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GEMINI_API_KEY,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,POSTGRES_PASSWORD,N8N_USER,N8N_PASSWORD,VPS_IP,S2_API_KEY,GITHUB_TOKEN,GOOGLE_SEARCH_API_KEY,GOOGLE_SEARCH_CX
          script: |
            set -e
            cd /root/Agentx
            git pull origin main
            touch .env
            set_env() {
              if grep -q "^$1=" .env; then
                sed -i "s|^$1=.*|$1=$2|" .env
              else
                echo "$1=$2" >> .env
              fi
            }
            set_env GEMINI_API_KEY "$GEMINI_API_KEY"
            set_env POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
            set_env N8N_USER "$N8N_USER"
            set_env N8N_PASSWORD "$N8N_PASSWORD"
            set_env VPS_IP "$VPS_IP"
            set_env S2_API_KEY "$S2_API_KEY"
            set_env GITHUB_TOKEN "$GITHUB_TOKEN"
            set_env GOOGLE_SEARCH_API_KEY "$GOOGLE_SEARCH_API_KEY"
            set_env GOOGLE_SEARCH_CX "$GOOGLE_SEARCH_CX"
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          N8N_USER: ${{ secrets.N8N_USER }}
          N8N_PASSWORD: ${{ secrets.N8N_PASSWORD }}
          VPS_IP: ${{ secrets.VPS_IP }}
          S2_API_KEY: ${{ secrets.S2_API_KEY || 's2k-xzPTxGaj8Zg469HUyVdrK82ZUosfm45qWtcQamjd' }}
          GITHUB_TOKEN: ${{ secrets.GH_SEARCH_TOKEN }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
